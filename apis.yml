aid: entropik
name: Entropik
description: >-
  Entropik is a human-insights company whose Decode platform uses Emotion AI —
  facial coding, eye and gaze tracking, and voice-tonality analysis — to help
  enterprises understand consumer and user behavior at scale. Decode combines an
  AI Moderator for automated, human-like qualitative interviews, consumer and
  shopper insights, webcam-based UX and user research, AI creative attention and
  emotion prediction, and a centralized Insights Hub research repository with a
  research copilot. Entropik reports serving 150+ enterprise clients across CPG,
  technology and software, healthcare and pharma, financial services, and retail
  and e-commerce. The company is backed by Bessemer Venture Partners. Entropik
  does not currently publish a public developer API, OpenAPI, or developer
  portal; this profile captures the company's identity, product surface, trust
  and compliance posture, and domain security.
